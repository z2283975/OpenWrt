name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/setup-haskell
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf git wget curl rsync unzip python3 python3-pip python3-setuptools python3-dev file
          
      - name: 准备源码与自定义脚本
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 缓存编译文件
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
            openwrt/staging_dir
          key: ${{ runner.os }}-openwrt-x86-64

      - name: 开始编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

