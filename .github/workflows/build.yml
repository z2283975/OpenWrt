name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'config.seed'
      - 'diy.sh'

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # 这里切换源码仓库和分支
      REPO_URL: https://github.com/coolsnowwolf/lede.git
      REPO_BRANCH: master
      # 如果想用官方 OpenWrt 的 5.15 分支，可改成：
      # REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
      # REPO_BRANCH: openwrt-22.03
      KERNEL_VERSION: "5.15"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell
          sudo swapoff -a || true
          sudo rm -f /swapfile
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget liblzma-dev \
            ccache ninja-build subversion asciidoc binutils bzip2 \
            libelf-dev libncurses5-dev libglib2.0-dev xmlto qemu-utils upx \
            libboost-dev libpam0g-dev xsltproc

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Apply config.seed
        run: |
          cp config.seed openwrt/.config
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Run diy.sh
        run: |
          cd openwrt
          chmod +x ../diy.sh
          bash ../diy.sh

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.img
            openwrt/bin/targets/x86/64/*.ext4*
            openwrt/.config



