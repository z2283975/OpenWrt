name: Build OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'config.seed'
      - 'diy.sh'

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      REPO_URL: https://github.com/coolsnowwolf/lede.git
      REPO_BRANCH: master
      KERNEL_VERSION: "5.15"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell
          sudo swapoff -a || true
          sudo rm -f /swapfile
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget liblzma-dev \
            ccache ninja-build subversion asciidoc binutils bzip2 \
            libelf-dev libncurses5-dev libglib2.0-dev xmlto qemu-utils upx \
            libboost-dev libpam0g-dev xsltproc

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt

      # 先更新/安装 feeds，单独成 step，失败时能精确定位
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true   # 容忍个别包安装告警的非0退出

      # 再放 config.seed（feeds 之后就不会被覆盖）
      - name: Apply config.seed
        run: |
          cd openwrt
          cp -f ../config.seed .config

      # diy.sh 在 defconfig 之前跑，让它写入的主题/地址配置被一并纳入
      - name: Run diy.sh
        run: |
          cd openwrt
          chmod +x ../diy.sh
          bash ../diy.sh

      # 最后统一 defconfig，自动补全依赖
      - name: Make defconfig
        run: |
          cd openwrt
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make 内部工具 -j$(nproc) || make 内部工具 -j1

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.img
            openwrt/bin/targets/x86/64/*.ext4*
            openwrt/.config



