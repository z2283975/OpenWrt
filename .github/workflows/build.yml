name: Build OpenWrt

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'diy.sh'
      - '.config'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # ========== 新增：安装LEDE全套编译依赖（解决prereq报错核心）==========
      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget ccache subversion qemu-utils squashfs-tools

      - name: 拉取 Lean Lede 源码（浅克隆）
        run: git clone --depth=1 https://github.com/coolsnowwolf/lede openwrt

      - name: Copy config & diy.sh
        run: |
          cp .config openwrt/
          cp diy.sh openwrt/

      - name: Cache OpenWrt & ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 编译准备 & 执行diy
        run: |
          cd openwrt
          chmod +x diy.sh
          ./diy.sh
          make defconfig

      - name: 预下载源码（失败自动重试）
        run: |
          cd openwrt
          make download -j4 || make download -j4

      - name: 开始编译
        run: |
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          make -j4 V=s

      - name: 上传固件成品
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: openwrt/bin/targets/x86/64/


